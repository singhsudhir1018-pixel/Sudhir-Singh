<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Filter out benign Vite HMR websocket logs in sandboxed preview
      (function() {
        const isViteLog = (arg) => {
          if (!arg) return false;
          const str = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return str.includes('[vite]') || str.includes('WebSocket') || str.includes('ws://') || str.includes('wss://');
        };
        const origError = console.error;
        console.error = function(...args) {
          if (args.some(isViteLog)) return;
          return origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(isViteLog)) return;
          return origWarn.apply(console, args);
        };
        const origLog = console.log;
        console.log = function(...args) {
          if (args.some(isViteLog)) return;
          return origLog.apply(console, args);
        };
      })();
    </script>
    <meta name="theme-color" content="#16a34a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
