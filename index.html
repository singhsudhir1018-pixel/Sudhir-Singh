<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Filter out benign Vite HMR websocket logs in sandboxed preview
      (function() {
        const isViteLog = (arg) => {
          if (!arg) return false;
          const str = typeof arg === 'string' ? arg : (arg.message || String(arg));
          return str.includes('[vite]') || str.includes('WebSocket') || str.includes('ws://') || str.includes('wss://');
        };
        const origError = console.error;
        console.error = function(...args) {
          if (args.some(isViteLog)) return;
          return origError.apply(console, args);
        };
        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(isViteLog)) return;
          return origWarn.apply(console, args);
        };
        const origLog = console.log;
        console.log = function(...args) {
          if (args.some(isViteLog)) return;
          return origLog.apply(console, args);
        };
        window.addEventListener('unhandledrejection', function(event) {
          const reason = event && event.reason;
          const msg = reason && (reason.message || String(reason));
          const stack = reason && reason.stack ? String(reason.stack) : '';
          if (
            (msg && (msg.includes('WebSocket closed without opened') || msg.includes('[vite]'))) ||
            (stack && stack.includes('@vite/client') && stack.includes('WebSocket'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          const msg = event && event.message ? String(event.message) : '';
          const filename = event && event.filename ? String(event.filename) : '';
          if (
            msg.includes('WebSocket closed without opened') ||
            (filename.includes('@vite/client') && msg.includes('WebSocket'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
